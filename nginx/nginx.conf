# KAFE reverse proxy. Wildcard subdomain → tek Next.js container.
# Cloudflare önde: Browser↔CF HTTPS, CF↔origin HTTPS (Full strict) origin cert ile.
# PRIMARY domain: dijitalkafe.com. Eski to-p1.com → dijitalkafe.com'a 301
# (subdomain + path korunur, eski QR/linkler kırılmaz).

upstream kafe_web {
    server web:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Yüklenen görseller: nginx doğrudan uploads volume'undan servis eder.
# (Next.js standalone runtime'da public/uploads dosyalarını servis etmiyor.)

# ============================================================
# dijitalkafe.com (PRIMARY) — uygulamayı servis eder
# ============================================================

# HTTP (80)
server {
    listen 80;
    listen [::]:80;
    server_name dijitalkafe.com www.dijitalkafe.com *.dijitalkafe.com;
    client_max_body_size 12m;
    server_tokens off;

    location /uploads/ {
        alias /var/www/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://kafe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# HTTPS (443) — Cloudflare Origin Certificate (dijitalkafe.com + *.dijitalkafe.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dijitalkafe.com www.dijitalkafe.com *.dijitalkafe.com;
    client_max_body_size 12m;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/dijitalkafe.crt;
    ssl_certificate_key /etc/nginx/certs/dijitalkafe.key;

    location /uploads/ {
        alias /var/www/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://kafe_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# ============================================================
# to-p1.com (ESKİ) → dijitalkafe.com'a 301 yönlendirme
# origin.crt hâlâ to-p1.com + *.to-p1.com'u kapsadığı için Full strict geçer.
# ============================================================

# apex + www → dijitalkafe.com
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name to-p1.com www.to-p1.com;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    return 301 https://dijitalkafe.com$request_uri;
}

# <slug>.to-p1.com → <slug>.dijitalkafe.com (subdomain korunur)
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(?<sub>.+)\.to-p1\.com$;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    return 301 https://$sub.dijitalkafe.com$request_uri;
}
