# Yerel geliştirme altyapısı: Postgres + Redis.
# Next.js'i host'ta çalıştır:  npm run dev
# Başlat:  docker compose up -d
name: kafe-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kafe
      POSTGRES_PASSWORD: kafe_dev_pw
      POSTGRES_DB: kafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafe -d kafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
