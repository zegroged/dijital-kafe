# Üretim deploy stack'i: migrate + web + db + redis + nginx.
# Çalıştır:  docker compose -f docker-compose.prod.yml up -d --build
# Gizli değerler aynı dizindeki .env dosyasından gelir (compose otomatik okur).
name: kafe

services:
  # Önce migration'ları uygula, sonra web başlasın.
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
      args:
        # .env'deki NEXT_PUBLIC_ROOT_DOMAIN build'e aktarılır (client paketlerine
        # gömülür). Domain değişince .env'i güncelle + yeniden build et.
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-to-p1.com}
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    expose:
      - "3000"
    volumes:
      - uploads:/app/public/uploads

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kafe
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafe -d kafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - uploads:/var/www/uploads:ro

volumes:
  pgdata:
  redisdata:
  uploads:
